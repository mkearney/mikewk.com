{{ define "main" }}
<div class="wrap block">
  <header class="page-head"><h1>{{ .Title }}</h1></header>
  <ul class="tag-list tag-list-large">
    {{ range .Data.Terms.Alphabetical }}
    <li><a href="{{ .Page.RelPermalink }}">{{ .Page.Title }} <span>{{ .Count }}</span></a></li>
    {{ end }}
  </ul>
</div>
{{ end }}
