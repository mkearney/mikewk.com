<li class="post-item">
  <a class="post-link" href="{{ .RelPermalink }}">
    <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "Jan 2, 2006" }}</time>
    <span class="post-item-title">{{ .Title }}</span>
    <span class="post-item-summary">{{ .Summary | replaceRE `<sup>.*?</sup>` "" | plainify | htmlUnescape | truncate 180 }}</span>
  </a>
</li>
