<footer class="site-footer">
  <p>© 2017–{{ now.Year }} {{ site.Copyright | default site.Title }}</p>
</footer>
{{ if .IsPage }}
<a title="Back to top" class="to-top is-hide" href="#"><span class="icon icon-up"></span></a>
<script src="{{ "highlight/highlight.pack.js" | relURL }}"></script>
<script>hljs.initHighlightingOnLoad();</script>
{{ end }}
{{ if .Params.math }}
<script>window.MathJax = { tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] } };</script>
<script async src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-chtml.js"></script>
{{ end }}
<script src="{{ "js/site.js" | relURL }}"></script>
