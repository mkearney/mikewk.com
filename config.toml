baseURL = "https://mikewk.com/"
languageCode = "en"
title = "Michael W. Kearney"
publishDir = "docs"
enableRobotsTXT = true
summaryLength = 50
copyright = "Michael W. Kearney"

# R Markdown sources are rendered to .html by blogdown; Hugo only needs the output.
ignoreFiles = ["\\.Rmd$", "\\.Rmarkdown$", "_files$", "_cache$"]

[pagination]
  pagerSize = 10

[taxonomies]
  category = "categories"
  tag = "tags"

[markup.goldmark.renderer]
  # Posts rendered by blogdown contain raw HTML.
  unsafe = true

[markup.highlight]
  # Code is highlighted client-side with highlight.js.
  codeFences = false

[services.disqus]
  shortname = "kearneymw"

[[menu.main]]
  name = "Home"
  identifier = "home"
  url = "/"
  weight = 10

[[menu.main]]
  name = "About"
  identifier = "about"
  pageRef = "/about"
  weight = 20

[[menu.main]]
  name = "Publications"
  identifier = "publications"
  pageRef = "/publications"
  weight = 30

[[menu.main]]
  name = "CV"
  identifier = "cv"
  url = "https://cv.mikewk.com"
  weight = 40

[params]
  author = "Michael W. Kearney, Ph.D."
  avatar = "/img/aintnoseats.jpeg"
  shareImage = "/img/avatar.jpg"
  subtitle = ["Senior AI/Data Scientist", "NLP – Machine Learning", "Responsible AI", "Creative Solutions"]
  description = "Personal website of Michael W. Kearney, Senior AI/Data Scientist – NLP – Machine Learning – Responsible AI"
  themeColor = "#5fbf5e"
  googleSiteVerification = "XjRg6K6oRqzExBrXKJh8Z2BrPJsc9WCVNOEWvhN68oY"

  # Social links, rendered in this order in the sidebar. `icon` maps to the iconfont classes in css/bundle.css.
