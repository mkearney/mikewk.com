baseURL = "https://mikewk.com/"
languageCode = "en"
title = "Michael W. Kearney"
publishDir = "docs"
enableRobotsTXT = true
summaryLength = 50
copyright = "Michael W. Kearney"

# R Markdown sources are rendered to .html by blogdown; Hugo only needs the output.
ignoreFiles = ["\\.Rmd$", "\\.Rmarkdown$", "_files$", "_cache$"]

[pagination]
  pagerSize = 10

[taxonomies]
  category = "categories"
  tag = "tags"

[markup.goldmark.renderer]
  # Posts rendered by blogdown contain raw HTML.
  unsafe = true

[markup.goldmark.parser]
  # Let standalone images render as <figure> rather than inside <p>.
  wrapStandAloneImageWithinParagraph = false

[markup.highlight]
  # Code is highlighted client-side with highlight.js.
  codeFences = false

[services.disqus]
  shortname = "kearneymw"

[[menu.main]]
  name = "Writing"
  identifier = "writing"
  pageRef = "/post"
  weight = 10

